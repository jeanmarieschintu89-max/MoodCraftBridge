name: MoodCraftBridge
version: 1.0
main: fr.moodcraft.bridge.Main
api-version: 1.21

author: MoodCraft
description: Systeme economie + banque + marche dynamique

depend: [Vault]
softdepend: [QuickShop]

commands:

  menu:
    description: Ouvrir le menu principal
    usage: /menu

  banque:
    description: Ouvrir la banque
    usage: /banque

  iban:
    description: Voir son IBAN
    usage: /iban

  virement:
    description: Effectuer un virement bancaire
    usage: /virement <iban> <montant>
    aliases: [ibanpay, pay]

  historique:
    description: Voir son historique bancaire
    usage: /historique [depot|retrait|virement] [joueur/page]
    aliases: [bankhistory, history]

  logsbanque:
    description: Voir les logs bancaires (admin)
    usage: /logsbanque
    permission: moodcraft.admin

  prix:
    description: Voir les prix du marché
    usage: /prix

  sync:
    description: Synchroniser les prix QuickShop
    usage: /sync
    permission: moodcraft.admin

  trend:
    description: Voir les tendances
    usage: /trend

  ecoreload:
    description: Recharger l'économie
    usage: /ecoreload
    permission: moodcraft.admin

  ecoreset:
    description: Reset économie
    usage: /ecoreset
    permission: moodcraft.admin

  ecotest:
    description: Test économie
    usage: /ecotest
    permission: moodcraft.admin

  reputation:
    description: Voir sa réputation
    usage: /reputation

  rep:
    description: Modifier la réputation (admin)
    usage: /rep <joueur> <valeur>
    permission: moodcraft.admin

  toprep:
    description: Voir le classement réputation
    usage: /toprep

permissions:

  moodcraft.admin:
    description: Acces admin economie
    default: op

  econ.admin:
    description: Admin banque (iban autres joueurs)
    default: op