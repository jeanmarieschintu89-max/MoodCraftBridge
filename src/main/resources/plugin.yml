name: MoodCraftBridge
version: 1.0

main: fr.moodcraft.bridge.Main

api-version: 1.21

author: MoodCraft

description: Systeme economie + banque + marche dynamique

depend: [Vault]

softdepend:
  - QuickShop
  - SkinsRestorer
  - floodgate
  - Geyser-Spigot
  - MoodTownFlag

commands:

  menu:
    description: Ouvrir le menu principal
    usage: /menu

  freeze:
    description: Freeze un joueur
    usage: /freeze <joueur>
    permission: moodcraft.admin

  banque:
    description: Systeme bancaire complet
    usage: /banque
    aliases:
      - bank
      - b

  depot:
    description: Déposer de l'argent
    usage: /depot <montant>

  retrait:
    description: Retirer de l'argent
    usage: /retrait <montant>

  rib:
    description: Voir son RIB bancaire
    usage: /rib

  virement:
    description: Effectuer un virement bancaire
    usage: /virement <iban> <montant>

  prix:
    description: Voir les prix du marché
    usage: /prix
    aliases:
      - bourse
      - market
      - commerce
      - cours
      - brs
      - vendre
      - vente
      - minerais

  sync:
    description: Synchroniser les prix QuickShop
    usage: /sync
    permission: moodcraft.admin

  trend:
    description: Voir les tendances
    usage: /trend <item>

  ecoreload:
    description: Recharger l'économie
    usage: /ecoreload
    permission: moodcraft.admin

  ecoreset:
    description: Reset économie
    usage: /ecoreset
    permission: moodcraft.admin

  ecotest:
    description: Test économie
    usage: /ecotest
    permission: moodcraft.admin

  reputation:
    description: Voir sa réputation
    usage: /reputation

  rep:
    description: Modifier la réputation
    usage: /rep <joueur> <valeur>
    permission: moodcraft.admin

  toprep:
    description: Voir le classement réputation
    usage: /toprep

  subvention:
    description: Gérer les subventions
    usage: /subvention
    permission: moodcraft.admin

permissions:

  moodcraft.admin:
    description: Acces admin economie
    default: op

  econ.admin:
    description: Admin banque (iban autres joueurs)
    default: op