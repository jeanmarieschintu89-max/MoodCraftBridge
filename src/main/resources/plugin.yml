name: MoodCraftBridge
version: 1.0

main: fr.moodcraft.bridge.Main

api-version: 1.21

author: MoodCraft

description: Systeme economie + banque + marche dynamique

depend: [Vault]

softdepend:
  - QuickShop
  - SkinsRestorer
  - floodgate
  - Geyser-Spigot
  - MoodTownFlag
  - Towny

commands:

  menu:
    description: Ouvrir le menu principal
    usage: /menu

  furnace:
    description: Cuire ou fondre l'item en main
    usage: /furnace
    permission: moodcraftbridge.furnace
    permission-message: "§c✖ §fCommande réservée au grade VIP."

  cuire:
    description: Cuire l'item en main
    usage: /cuire
    permission: moodcraftbridge.furnace
    permission-message: "§c✖ §fCommande réservée au grade VIP."

  fondre:
    description: Fondre l'item en main
    usage: /fondre
    permission: moodcraftbridge.furnace
    permission-message: "§c✖ §fCommande réservée au grade VIP."

  moodplmaj:
    description: Lancer la mise à jour automatique des plugins MoodCraft
    usage: /moodplmaj [message]
    permission: moodcraft.admin
    permission-message: "§c✖ §fAccès réservé à l'administration MoodCraft."
    aliases:
      - pluginsmaj
      - majplugins
      - updateplugins
      - majplugin

  freeze:
    description: Freeze un joueur
    usage: /freeze <joueur>
    permission: moodcraft.admin
    permission-message: "§c✖ §fAccès réservé à l'administration MoodCraft."

  banque:
    description: Systeme bancaire complet
    usage: /banque
    aliases:
      - bank
      - b

  depot:
    description: Déposer de l'argent
    usage: /depot <montant>

  retrait:
    description: Retirer de l'argent
    usage: /retrait <montant>

  rib:
    description: Voir son RIB bancaire
    usage: /rib

  virement:
    description: Effectuer un virement bancaire
    usage: /virement <iban> <montant>

  bankadmin:
    description: Administration bancaire MoodCraft
    usage: /bankadmin
    permission: econ.admin
    permission-message: "§c✖ §fAccès réservé à l'administration bancaire."
    aliases:
      - badmin
      - banqueadmin

  trackeco:
    description: Ouvrir le suivi économique complet d'un joueur
    usage: /trackeco <joueur>
    permission: econ.admin
    permission-message: "§c✖ §fAccès réservé à l'administration économique."
    aliases:
      - ecohistory
      - ecohist
      - trackmoney
      - suivieco

  uuidtrack:
    description: Trouver tous les UUID et fortunes d'un joueur
    usage: /uuidtrack <joueur>
    permission: econ.admin
    permission-message: "§c✖ §fAccès réservé à l'administration économique."
    aliases:
      - trackuuid
      - doublecompte
      - uuidmoney

  uuidclean:
    description: Remettre à zéro les données économie d'un ancien UUID
    usage: /uuidclean <uuid> CONFIRM
    permission: econ.admin
    permission-message: "§c✖ §fAccès réservé à l'administration économique."
    aliases:
      - cleanuuid
      - resetuuidmoney
      - uuidreset

  fortune:
    description: Voir la fortune totale d'un joueur
    usage: /fortune <joueur>
    permission: econ.admin
    permission-message: "§c✖ §fAccès réservé à l'administration économique."
    aliases:
      - totalargent
      - argenttotal
      - fortunetotal
      - ecofortune

  fortunepanel:
    description: Lier des panneaux au classement fortune
    usage: /fortunepanel <set|refresh|clear> [1/2/3]
    permission: econ.admin
    permission-message: "§c✖ §fAccès réservé à l'administration économique."
    aliases:
      - fpanel
      - richpanel
      - panelrich

  votepanel:
    description: Lier des panneaux au classement votes MoodCraft.fr
    usage: /votepanel <set|refresh|clear> [1-10]
    permission: econ.admin
    permission-message: "§c✖ §fAccès réservé à l'administration."
    aliases:
      - vpanel
      - votetop
      - panelvote

  votereward:
    description: Prévisualiser ou forcer les récompenses mensuelles de vote
    usage: /votereward <preview|run CONFIRM>
    permission: econ.admin
    permission-message: "§c✖ §fAccès réservé à l'administration."
    aliases:
      - rewardsvote
      - votemonthly
      - monthlyvote

  prix:
    description: Voir les prix du marché
    usage: /prix
    aliases:
      - bourse
      - market
      - commerce
      - cours
      - brs
      - vendre
      - vente
      - minerais

  marketadmin:
    description: Administration du marché MoodCraft
    usage: /marketadmin
    permission: moodcraft.admin
    permission-message: "§c✖ §fAccès réservé à l'administration MoodCraft."
    aliases:
      - madminmarket
      - marcheadmin
      - bourseadmin

  sync:
    description: Synchroniser les prix QuickShop
    usage: /sync
    permission: moodcraft.admin
    permission-message: "§c✖ §fAccès réservé à l'administration MoodCraft."

  trend:
    description: Voir les tendances
    usage: /trend <item>

  ecoreload:
    description: Recharger l'économie
    usage: /ecoreload
    permission: moodcraft.admin
    permission-message: "§c✖ §fAccès réservé à l'administration MoodCraft."

  ecoreset:
    description: Reset économie
    usage: /ecoreset
    permission: moodcraft.admin
    permission-message: "§c✖ §fAccès réservé à l'administration MoodCraft."

  ecotest:
    description: Test économie
    usage: /ecotest
    permission: moodcraft.admin
    permission-message: "§c✖ §fAccès réservé à l'administration MoodCraft."

  reputation:
    description: Voir sa réputation
    usage: /reputation
    aliases:
      - rep

  toprep:
    description: Voir le classement réputation
    usage: /toprep

  subvention:
    description: Gérer les subventions
    usage: /subvention
    permission: moodcraft.admin
    permission-message: "§c✖ §fAccès réservé à l'administration MoodCraft."

permissions:

  moodcraft.admin:
    description: Acces admin economie
    default: op

  econ.admin:
    description: Admin banque (iban autres joueurs)
    default: op

  moodcraftbridge.furnace:
    description: Autorise /furnace, /cuire et /fondre
    default: false