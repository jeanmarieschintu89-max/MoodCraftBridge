base:

  netherite: 16000
  diamond: 2000
  emerald: 1200

  gold: 80
  iron: 45
  copper: 10

  redstone: 9
  lapis: 12
  coal: 6

  quartz: 25
  glowstone: 22
  amethyst: 14

#
# ⚖ Influence générale du minerai
#

weight:
  netherite: 0.9
  diamond: 1.0
  emerald: 0.8
  gold: 0.9
  iron: 0.7
  copper: 0.6
  quartz: 0.6
  redstone: 0.5
  lapis: 0.5
  coal: 0.3
  amethyst: 0.6
  glowstone: 0.6

#
# 💥 Résistance aux variations
# plus le chiffre est grand = plus stable
#

impact:
  netherite: 45
  diamond: 65
  emerald: 75
  gold: 80
  iron: 95
  copper: 110
  quartz: 110
  redstone: 130
  lapis: 130
  coal: 180
  amethyst: 120
  glowstone: 120

#
# 📈 Activité économique
#

activity:
  netherite: 0.0008
  diamond: 0.0012
  emerald: 0.0014
  gold: 0.0018
  iron: 0.0022
  copper: 0.0030
  quartz: 0.0030
  redstone: 0.0040
  lapis: 0.0040
  coal: 0.0050
  amethyst: 0.0035
  glowstone: 0.0035

#
# 🌟 Rareté uniforme
#

rarity:
  netherite: 500
  diamond: 500
  emerald: 500
  gold: 500
  iron: 500
  copper: 500
  quartz: 500
  redstone: 500
  lapis: 500
  coal: 500
  amethyst: 500
  glowstone: 500

#
# ⚙ MOTEUR ÉCONOMIQUE
#

engine:

  #
  # 🔄 Retour progressif au prix base
  # plus bas = le marché garde plus longtemps ses variations
  #

  base_return: 0.006

  #
  # 📉 Variation max par tick
  #

  max_change: 0.045

  #
  # 📊 Limite activité
  #

  activity_cap: 0.03

  #
  # 🧱 Limites prix
  #

  min_price_factor: 0.45
  max_price_factor: 1.35

  #
  # 🧹 Nettoyage stock
  #

  stock_decay: 0.90

  #
  # 🛒 Achat en coffre/shop = demande ↑ = prix ↑
  #

  buy_multiplier: 1.35

  #
  # 💸 Vente via /prix = offre ↑ = prix ↓
  #

  sell_multiplier: 1.0

  #
  # ⛏ Minage = offre créée = prix ↓
  #

  mining_multiplier: 0.75

  #
  # 🌟 Rareté globale légère
  #

  rarity:

    enabled: true

    #
    # légère tension économique
    #

    boost: 0.0005

    #
    # neutre
    #

    exponent: 1.00

    #
    # plafond raisonnable
    #

    max_boost: 0.008

#
# 🪽 VOL TEMPORAIRE MOODCRAFT
#
# Important : laissé à false tant que Jean-Marie ne demande pas l'activation.
# /fly reste à Essentials. MoodCraft utilise /vol.
#

vol:
  enabled: false

#
# 🗳️ TOP VOTES MOODCRAFT.FR
#

vote-top:
  url: "https://moodcraft.fr/vote"

  monthly-rewards:
    enabled: true

    # Dernier jour du mois à 23:55.
    # Le plugin empêche une double distribution avec last-rewarded-month.
    hour: 23
    minute: 55
    last-rewarded-month: ""

    # Commandes console lancées pour les gagnants.
    # Syntaxe ExcellentCrates: crates key give <joueur> <cle> <nombre>
    # Variables: {player}, {uuid}, {rank}, {votes}
    commands:
      1:
        - "crates key give {player} emeraude 1"
      2:
        - "crates key give {player} diamant 1"
      3:
        - "crates key give {player} or 1"
