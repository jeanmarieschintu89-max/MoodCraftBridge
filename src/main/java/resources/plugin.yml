name: MoodCraftBridge
version: 1.0
main: fr.moodcraft.bridge.Main
api-version: 1.20

depend: [Vault]
softdepend: [QuickShop, Jobs]

commands:

  ecoreload:
    description: Reload économie
    permission: moodcraft.admin

  ecoreset:
    description: Reset économie
    permission: moodcraft.admin

  ecotest:
    description: Test du marché
    permission: moodcraft.admin

  prix:
    description: Ouvre la bourse
    aliases: [bourse]

  menu:
    description: Ouvre le menu principal

  iban:
    description: Voir son IBAN
    usage: /iban [joueur]

  ibanpay:
    description: Envoyer un virement IBAN
    usage: /ibanpay <iban> <montant>

  trend:
    description: Voir la tendance d’un item
    usage: /trend <item>

  sync:
    description: Synchronise les prix du marché
    permission: moodcraft.admin

  bank:
    description: Ouvre la banque