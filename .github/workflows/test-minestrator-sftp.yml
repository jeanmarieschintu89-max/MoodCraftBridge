name: 3 Redémarrer le serveur

on:
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: 'Délai avant redémarrage'
        required: true
        default: '10'
        type: choice
        options:
          - '10'
          - '20'
          - '30'
      reason:
        description: 'Message court affiché aux joueurs'
        required: true
        default: 'Mise à jour MoodCraft'
        type: string

permissions:
  contents: read

concurrency:
  group: moodcraft-server-restart
  cancel-in-progress: false

jobs:
  restart:
    name: Annoncer puis redémarrer le serveur
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Envoyer le compte à rebours puis redémarrer
        shell: bash
        env:
          RCON_HOST: ${{ secrets.MINECRAFT_RCON_HOST }}
          RCON_PORT: ${{ secrets.MINECRAFT_RCON_PORT }}
          RCON_PASSWORD: ${{ secrets.MINECRAFT_RCON_PASSWORD }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          RCON_PORT="${RCON_PORT:-25575}"

          missing=0
          for var in RCON_HOST RCON_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Missing secret: ${var}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "Restart cancelled: missing RCON secret."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import socket
          import struct
          import time

          host = os.environ["RCON_HOST"]
          port = int(os.environ.get("RCON_PORT") or "25575")
          password = os.environ["RCON_PASSWORD"]
          delay = int(os.environ.get("DELAY_SECONDS") or "10")
          reason = os.environ.get("REASON") or "Mise à jour MoodCraft"

          class Rcon:
              def __init__(self, host, port, password):
                  self.host = host
                  self.port = port
                  self.password = password
                  self.sock = socket.create_connection((host, port), timeout=10)
                  self.request_id = 100

              def close(self):
                  try:
                      self.sock.close()
                  except Exception:
                      pass

              def send_packet(self, packet_type, body):
                  self.request_id += 1
                  request_id = self.request_id
                  payload = body.encode("utf-8") + b"\x00\x00"
                  packet = struct.pack("<ii", request_id, packet_type) + payload
                  self.sock.sendall(struct.pack("<i", len(packet)) + packet)
                  return request_id

              def read_packet(self):
                  raw_len = self._read_exact(4)
                  length = struct.unpack("<i", raw_len)[0]
                  data = self._read_exact(length)
                  request_id, packet_type = struct.unpack("<ii", data[:8])
                  body = data[8:-2].decode("utf-8", errors="replace")
                  return request_id, packet_type, body

              def _read_exact(self, n):
                  data = b""
                  while len(data) < n:
                      chunk = self.sock.recv(n - len(data))
                      if not chunk:
                          raise ConnectionError("RCON connection closed")
                      data += chunk
                  return data

              def login(self):
                  self.send_packet(3, self.password)
                  request_id, _, body = self.read_packet()
                  if request_id == -1:
                      raise PermissionError("RCON authentication failed")
                  return body

              def command(self, command):
                  self.send_packet(2, command)
                  return self.read_packet()[2]

          def j(payload):
              return json.dumps(payload, ensure_ascii=False)

          def tellraw(rcon, payload):
              rcon.command(f"tellraw @a {j(payload)}")

          def title(rcon, mode, payload):
              rcon.command(f"title @a {mode} {j(payload)}")

          def actionbar(rcon, seconds):
              title(rcon, "actionbar", [
                  {"text": "⚠ ", "color": "dark_red", "bold": True},
                  {"text": "REDÉMARRAGE SERVEUR ", "color": "red", "bold": True},
                  {"text": f"dans {seconds}s", "color": "gold", "bold": True}
              ])

          rcon = Rcon(host, port, password)
          try:
              rcon.login()

              rcon.command("title @a times 10 40 10")
              tellraw(rcon, [
                  {"text": "\n⚠ REDÉMARRAGE SERVEUR ⚠\n", "color": "dark_red", "bold": True},
                  {"text": "Le serveur va redémarrer dans ", "color": "red", "bold": True},
                  {"text": f"{delay} secondes", "color": "gold", "bold": True},
                  {"text": ".\n", "color": "red", "bold": True},
                  {"text": "Raison : ", "color": "gray"},
                  {"text": reason, "color": "yellow"},
                  {"text": "\nVeuillez ne pas lancer d'action importante.\n", "color": "gray"}
              ])
              title(rcon, "title", {"text": "⚠ REDÉMARRAGE", "color": "dark_red", "bold": True})
              title(rcon, "subtitle", {"text": f"Dans {delay} secondes", "color": "gold", "bold": True})
              rcon.command("playsound minecraft:block.note_block.pling master @a ~ ~ ~ 1 0.6")

              for remaining in range(delay, 0, -1):
                  actionbar(rcon, remaining)

                  if remaining in (10, 5, 3, 2, 1):
                      tellraw(rcon, [
                          {"text": "⚠ ", "color": "dark_red", "bold": True},
                          {"text": "Redémarrage dans ", "color": "red", "bold": True},
                          {"text": f"{remaining}s", "color": "gold", "bold": True}
                      ])
                      rcon.command("playsound minecraft:block.note_block.pling master @a ~ ~ ~ 1 1.2")

                  time.sleep(1)

              title(rcon, "title", {"text": "REDÉMARRAGE...", "color": "dark_red", "bold": True})
              title(rcon, "subtitle", {"text": "À tout de suite", "color": "gold"})
              tellraw(rcon, {"text": "⚠ Redémarrage maintenant.", "color": "dark_red", "bold": True})
              rcon.command("restart")
          finally:
              rcon.close()
          PY
