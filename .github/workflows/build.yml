name: Build MoodCraftBridge

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 📦 Installer QuickShop depuis ton repo
      - name: Install QuickShop (local file)
        run: |
          mvn install:install-file \
            -Dfile=libs/QuickShop-Hikari.jar \
            -DgroupId=quickshop \
            -DartifactId=quickshop \
            -Dversion=1.0 \
            -Dpackaging=jar

      # 🔨 Build
      - name: Build
        run: mvn clean package

      # 📤 Upload
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: MoodCraftBridge
          path: target/MoodCraftBridge.jar