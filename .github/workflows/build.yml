name: 🔨 Build Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

# 🔥 ANTI FILE D’ATTENTE
concurrency:
  group: moodcraft-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 📥 CLONE REPO
      - name: Checkout
        uses: actions/checkout@v4

      # ☕ JAVA 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # ⚡ CACHE MAVEN (plus rapide)
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      # 🔥 INSTALL QUICKSHOP LOCAL (si présent)
      - name: Install QuickShop
        run: |
          if [ -f "libs/QuickShop-Hikari.jar" ]; then
            mvn install:install-file \
            -Dfile=libs/QuickShop-Hikari.jar \
            -DgroupId=quickshop \
            -DartifactId=quickshop \
            -Dversion=1.0 \
            -Dpackaging=jar
          else
            echo "QuickShop jar not found, skipping..."
          fi

      # 🔨 BUILD
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 📦 UPLOAD JAR
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodCraftBridge
          path: target/*.jar