name: Build MoodCraftBridge

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 Récupération du repo
      - name: Checkout
        uses: actions/checkout@v4

      # ☕ Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 📦 Télécharger QuickShop (version stable)
      - name: Download QuickShop
        run: |
          curl -L -o QuickShop.jar https://github.com/QuickShop-Community/QuickShop-Reremake/releases/latest/download/QuickShop.jar

      # 🔧 Installer QuickShop dans Maven local
      - name: Install QuickShop to Maven
        run: |
          mvn install:install-file \
            -Dfile=QuickShop.jar \
            -DgroupId=quickshop \
            -DartifactId=quickshop \
            -Dversion=1.0 \
            -Dpackaging=jar

      # 🔨 Build plugin
      - name: Build with Maven
        run: mvn clean package

      # 📤 Upload du JAR FINAL
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: MoodCraftBridge
          path: target/MoodCraftBridge.jar