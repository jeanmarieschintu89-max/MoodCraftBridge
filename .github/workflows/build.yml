name: Build MoodCraftBridge

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 🔥 Télécharger QuickShop PROPREMENT
      - name: Download QuickShop (safe)
        run: |
          wget -O QuickShop.jar https://github.com/QuickShop-Community/QuickShop-Reremake/releases/download/5.1.2.4/QuickShop-5.1.2.4.jar

      # 🔍 Vérifier que le fichier est valide
      - name: Verify jar
        run: |
          file QuickShop.jar
          ls -lh QuickShop.jar

      # 📦 Installer dans Maven
      - name: Install QuickShop
        run: |
          mvn install:install-file \
            -Dfile=QuickShop.jar \
            -DgroupId=quickshop \
            -DartifactId=quickshop \
            -Dversion=1.0 \
            -Dpackaging=jar

      # 🔨 Build
      - name: Build
        run: mvn clean package

      # 📤 Upload
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MoodCraftBridge
          path: target/MoodCraftBridge.jar