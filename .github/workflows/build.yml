name: 🔨 Build Plugin

on:
  push:
  pull_request:

  # 🔥 BOUTON MANUEL
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 Récupère le code
      - name: Checkout
        uses: actions/checkout@v4

      # ☕ Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ⚡ Cache Maven (build + rapide)
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      # 🔥 INSTALL QUICKSHOP (OBLIGATOIRE)
      - name: Install QuickShop locally
        run: |
          mvn install:install-file \
          -Dfile=libs/QuickShop-Hikari.jar \
          -DgroupId=quickshop \
          -DartifactId=quickshop \
          -Dversion=1.0 \
          -Dpackaging=jar

      # 🔨 BUILD
      - name: Build with Maven
        run: mvn clean package

      # 📦 Upload du plugin
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodCraftBridge
          path: target/*.jar