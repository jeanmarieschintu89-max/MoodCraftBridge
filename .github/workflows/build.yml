name: 🔨 Build Plugin

on:
  push:
    branches: [ "main" ]

  # 🔥 bouton manuel
  workflow_dispatch:

jobs:
  build:
    # 🚫 évite les boucles GitHub
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      # 📥 Clone du repo
      - name: Checkout
        uses: actions/checkout@v4

      # ☕ Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ⚡ Cache Maven
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      # 🔧 Install QuickShop (local dependency)
      - name: Install QuickShop locally
        run: |
          mvn install:install-file \
          -Dfile=libs/QuickShop-Hikari.jar \
          -DgroupId=quickshop \
          -DartifactId=quickshop \
          -Dversion=1.0 \
          -Dpackaging=jar

      # 🔨 Build plugin
      - name: Build with Maven
        run: mvn clean package

      # 📦 Upload .jar
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodCraftBridge
          path: target/*.jar