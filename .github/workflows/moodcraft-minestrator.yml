name: 1 MoodCraft - Minestrator

run-name: ${{ github.event.inputs.action }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        type: choice
        options:
          - "1 - Build et déploie Minestrator"
          - "2 - Redémarrage + message"
      delay_seconds:
        description: "Délai avant redémarrage"
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "20"
          - "30"
      reason:
        description: "Message court affiché aux joueurs"
        required: true
        default: "Mise à jour MoodCraft"
        type: string

permissions:
  contents: read

concurrency:
  group: moodcraft-minestrator
  cancel-in-progress: false

jobs:
  build-deploy:
    name: "1 - Build et déploie Minestrator"
    if: ${{ github.event.inputs.action == '1 - Build et déploie Minestrator' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Récupérer tous les plugins
        shell: bash
        env:
          TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          mkdir -p sources dist logs

          # Plugins actifs MoodCraft :
          # MoodTownSuite remplace MoodTownGrade, Moodtownmenu, MoodVilleDrapeau.
          # MoodProtection remplace MoodcraftChestLock, MoodVillagerTradeBlocker.
          # MoodWorldEvents remplace MoodCraftMeteo, MoodEvent.
          # MoodSkins synchronise les skins Bedrock en jeu.
          repos=(
            MoodAuth
            MoodCraftBridge
            MoodTownSuite
            MoodProtection
            MoodWorldEvents
            MoodBusiness
            MoodJobsGUI
            MoodSkins
          )

          for repo in "${repos[@]}"; do
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/jeanmarieschintu89-max/${repo}.git" "sources/${repo}"
          done

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'sources/**/pom.xml'

      - name: Construire les plugins et collecter les jars
        shell: bash
        run: |
          set -u

          plugins=(
            MoodAuth
            MoodCraftBridge
            MoodTownSuite
            MoodProtection
            MoodWorldEvents
            MoodBusiness
            MoodJobsGUI
            MoodSkins
          )

          failed=0

          for plugin in "${plugins[@]}"; do
            echo "========== Build ${plugin} =========="

            if [ ! -f "sources/${plugin}/pom.xml" ]; then
              echo "POM manquant : ${plugin}" | tee "logs/${plugin}.log"
              failed=1
              continue
            fi

            if (cd "sources/${plugin}" && mvn -B -DskipTests clean package > "../../logs/${plugin}.log" 2>&1); then
              jar="$(find "sources/${plugin}/target" -maxdepth 1 -type f -name '*.jar' ! -name '*original*' ! -name '*sources*' ! -name '*javadoc*' | sort | head -n 1)"

              if [ -n "${jar}" ]; then
                cp "${jar}" "dist/${plugin}.jar"
                echo "OK ${plugin}"
              else
                echo "Jar introuvable : ${plugin}" | tee -a "logs/${plugin}.log"
                failed=1
              fi
            else
              echo "Build échoué : ${plugin}"
              tail -n 120 "logs/${plugin}.log" || true
              failed=1
            fi
          done

          ls -lah dist || true

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi

      - name: Publier les jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoodCraft-all-plugin-jars
          path: dist/*.jar
          if-no-files-found: warn

      - name: Publier les logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoodCraft-build-logs
          path: logs/*.log
          if-no-files-found: warn

      - name: Envoyer vers Minestrator
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.MINESTRATOR_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.MINESTRATOR_SFTP_PORT }}
          SFTP_USER: ${{ secrets.MINESTRATOR_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.MINESTRATOR_SFTP_PASSWORD }}
          SFTP_PLUGINS_PATH: ${{ secrets.MINESTRATOR_PLUGINS_PATH }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp
          SFTP_PORT="${SFTP_PORT:-2022}"

          lftp -u "${SFTP_USER}","${SFTP_PASSWORD}" -p "${SFTP_PORT}" "sftp://${SFTP_HOST}" <<EOF
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          cd "${SFTP_PLUGINS_PATH}"
          mput dist/*.jar
          cls -l *.jar
          bye
          EOF

      - name: Alerte puis redémarrage après déploiement
        shell: bash
        env:
          RCON_HOST: ${{ secrets.MINECRAFT_RCON_HOST }}
          RCON_PORT: ${{ secrets.MINECRAFT_RCON_PORT }}
          RCON_PASSWORD: ${{ secrets.MINECRAFT_RCON_PASSWORD }}
          DELAY_SECONDS: ${{ github.event.inputs.delay_seconds }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          set -euo pipefail
          RCON_PORT="${RCON_PORT:-25575}"

          rcon() {
            docker run --rm itzg/rcon-cli --host "${RCON_HOST}" --port "${RCON_PORT}" --password "${RCON_PASSWORD}" "$1"
          }

          rcon "title @a times 10 40 10"
          rcon "tellraw @a [{\"text\":\"\\n⚠ REDÉMARRAGE SERVEUR ⚠\\n\",\"color\":\"dark_red\",\"bold\":true},{\"text\":\"Le serveur va redémarrer dans ${DELAY_SECONDS} secondes.\\n\",\"color\":\"red\",\"bold\":true},{\"text\":\"Raison : \",\"color\":\"gray\"},{\"text\":\"${REASON}\\n\",\"color\":\"yellow\"},{\"text\":\"Veuillez ne pas lancer d'action importante.\\n\",\"color\":\"gray\"}]"
          rcon "title @a title {\"text\":\"⚠ REDÉMARRAGE\",\"color\":\"dark_red\",\"bold\":true}"
          rcon "title @a subtitle {\"text\":\"Dans ${DELAY_SECONDS} secondes\",\"color\":\"gold\",\"bold\":true}"
          rcon "playsound minecraft:block.note_block.pling master @a ~ ~ ~ 1 0.6"

          for remaining in $(seq "${DELAY_SECONDS}" -1 1); do
            rcon "title @a actionbar [{\"text\":\"⚠ \",\"color\":\"dark_red\",\"bold\":true},{\"text\":\"REDÉMARRAGE SERVEUR \",\"color\":\"red\",\"bold\":true},{\"text\":\"dans ${remaining}s\",\"color\":\"gold\",\"bold\":true}]"

            if [ "${remaining}" = "10" ] || [ "${remaining}" = "5" ] || [ "${remaining}" = "3" ] || [ "${remaining}" = "2" ] || [ "${remaining}" = "1" ]; then
              rcon "tellraw @a [{\"text\":\"⚠ \",\"color\":\"dark_red\",\"bold\":true},{\"text\":\"Redémarrage dans \",\"color\":\"red\",\"bold\":true},{\"text\":\"${remaining}s\",\"color\":\"gold\",\"bold\":true}]"
              rcon "playsound minecraft:block.note_block.pling master @a ~ ~ ~ 1 1.2"
            fi

            sleep 1
          done

          rcon "title @a title {\"text\":\"REDÉMARRAGE...\",\"color\":\"dark_red\",\"bold\":true}"
          rcon "title @a subtitle {\"text\":\"À tout de suite\",\"color\":\"gold\"}"
          rcon "tellraw @a {\"text\":\"⚠ Redémarrage maintenant.\",\"color\":\"dark_red\",\"bold\":true}"
          rcon "restart"

  restart-message:
    name: "2 - Redémarrage + message"
    if: ${{ github.event.inputs.action == '2 - Redémarrage + message' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Alerte puis redémarrage
        shell: bash
        env:
          RCON_HOST: ${{ secrets.MINECRAFT_RCON_HOST }}
          RCON_PORT: ${{ secrets.MINECRAFT_RCON_PORT }}
          RCON_PASSWORD: ${{ secrets.MINECRAFT_RCON_PASSWORD }}
          DELAY_SECONDS: ${{ github.event.inputs.delay_seconds }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          set -euo pipefail
          RCON_PORT="${RCON_PORT:-25575}"

          rcon() {
            docker run --rm itzg/rcon-cli --host "${RCON_HOST}" --port "${RCON_PORT}" --password "${RCON_PASSWORD}" "$1"
          }

          rcon "title @a times 10 40 10"
          rcon "tellraw @a [{\"text\":\"\\n⚠ REDÉMARRAGE SERVEUR ⚠\\n\",\"color\":\"dark_red\",\"bold\":true},{\"text\":\"Le serveur va redémarrer dans ${DELAY_SECONDS} secondes.\\n\",\"color\":\"red\",\"bold\":true},{\"text\":\"Raison : \",\"color\":\"gray\"},{\"text\":\"${REASON}\\n\",\"color\":\"yellow\"},{\"text\":\"Veuillez ne pas lancer d'action importante.\\n\",\"color\":\"gray\"}]"
          rcon "title @a title {\"text\":\"⚠ REDÉMARRAGE\",\"color\":\"dark_red\",\"bold\":true}"
          rcon "title @a subtitle {\"text\":\"Dans ${DELAY_SECONDS} secondes\",\"color\":\"gold\",\"bold\":true}"
          rcon "playsound minecraft:block.note_block.pling master @a ~ ~ ~ 1 0.6"

          for remaining in $(seq "${DELAY_SECONDS}" -1 1); do
            rcon "title @a actionbar [{\"text\":\"⚠ \",\"color\":\"dark_red\",\"bold\":true},{\"text\":\"REDÉMARRAGE SERVEUR \",\"color\":\"red\",\"bold\":true},{\"text\":\"dans ${remaining}s\",\"color\":\"gold\",\"bold\":true}]"

            if [ "${remaining}" = "10" ] || [ "${remaining}" = "5" ] || [ "${remaining}" = "3" ] || [ "${remaining}" = "2" ] || [ "${remaining}" = "1" ]; then
              rcon "tellraw @a [{\"text\":\"⚠ \",\"color\":\"dark_red\",\"bold\":true},{\"text\":\"Redémarrage dans \",\"color\":\"red\",\"bold\":true},{\"text\":\"${remaining}s\",\"color\":\"gold\",\"bold\":true}]"
              rcon "playsound minecraft:block.note_block.pling master @a ~ ~ ~ 1 1.2"
            fi

            sleep 1
          done

          rcon "title @a title {\"text\":\"REDÉMARRAGE...\",\"color\":\"dark_red\",\"bold\":true}"
          rcon "title @a subtitle {\"text\":\"À tout de suite\",\"color\":\"gold\"}"
          rcon "tellraw @a {\"text\":\"⚠ Redémarrage maintenant.\",\"color\":\"dark_red\",\"bold\":true}"
          rcon "restart"
