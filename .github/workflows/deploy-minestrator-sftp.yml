name: 2 Upload to Minestrator

on:
  workflow_dispatch:
    inputs:
      clean_old_jars:
        description: 'Supprimer les anciens jars MoodCraft versionnes'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  actions: read

concurrency:
  group: moodcraft-minestrator-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Upload jars to Minestrator
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download latest build artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-all-plugins.yml
          workflow_conclusion: success
          name: MoodCraft-all-plugin-jars
          path: dist
          if_no_artifact_found: fail

      - name: Check jars
        shell: bash
        run: |
          set -euo pipefail
          echo "Jars prepared for upload:"
          ls -lah dist

          required=(
            MoodAuth.jar
            MoodVilleDrapeau.jar
            MoodCraftBridge.jar
            MoodTownGrade.jar
            MoodCraftMeteo.jar
            MoodcraftChestLock.jar
            Moodtownmenu.jar
            MoodBusiness.jar
            MoodEvent.jar
            MoodJobsGUI.jar
          )

          for jar in "${required[@]}"; do
            if [ ! -f "dist/${jar}" ]; then
              echo "Missing jar: ${jar}"
              exit 1
            fi
          done

      - name: Install SFTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload to Minestrator safely
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.MINESTRATOR_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.MINESTRATOR_SFTP_PORT }}
          SFTP_USER: ${{ secrets.MINESTRATOR_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.MINESTRATOR_SFTP_PASSWORD }}
          SFTP_PLUGINS_PATH: ${{ secrets.MINESTRATOR_PLUGINS_PATH }}
          CLEAN_OLD_JARS: ${{ inputs.clean_old_jars }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          SFTP_PORT="${SFTP_PORT:-2022}"
          missing=0
          for var in SFTP_HOST SFTP_USER SFTP_PASSWORD SFTP_PLUGINS_PATH; do
            if [ -z "${!var}" ]; then
              echo "Missing secret: ${var}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          cat > upload.lftp <<EOF
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mkdir -p "${SFTP_PLUGINS_PATH}"
          cd "${SFTP_PLUGINS_PATH}"
          mkdir -p "_moodcraft_upload_${RUN_ID}"
          cd "_moodcraft_upload_${RUN_ID}"
          mput dist/*.jar
          cls -l
          cd ..
          set cmd:fail-exit no
          rm -f MoodAuth.jar
          rm -f MoodVilleDrapeau.jar
          rm -f MoodCraftBridge.jar
          rm -f MoodTownGrade.jar
          rm -f MoodCraftMeteo.jar
          rm -f MoodcraftChestLock.jar
          rm -f Moodtownmenu.jar
          rm -f MoodBusiness.jar
          rm -f MoodEvent.jar
          rm -f MoodJobsGUI.jar
          EOF

          if [ "${CLEAN_OLD_JARS}" = "true" ]; then
            cat >> upload.lftp <<EOF
          glob -a rm -f MoodAuth-*.jar
          glob -a rm -f MoodVilleDrapeau-*.jar
          glob -a rm -f MoodCraftBridge-*.jar
          glob -a rm -f MoodTownGrade-*.jar
          glob -a rm -f MoodCraftMeteo-*.jar
          glob -a rm -f MoodcraftChestLock-*.jar
          glob -a rm -f Moodtownmenu-*.jar
          glob -a rm -f MoodBusiness-*.jar
          glob -a rm -f MoodEvent-*.jar
          glob -a rm -f MoodJobsGUI-*.jar
          EOF
          fi

          cat >> upload.lftp <<EOF
          set cmd:fail-exit yes
          mv _moodcraft_upload_${RUN_ID}/MoodAuth.jar MoodAuth.jar
          mv _moodcraft_upload_${RUN_ID}/MoodVilleDrapeau.jar MoodVilleDrapeau.jar
          mv _moodcraft_upload_${RUN_ID}/MoodCraftBridge.jar MoodCraftBridge.jar
          mv _moodcraft_upload_${RUN_ID}/MoodTownGrade.jar MoodTownGrade.jar
          mv _moodcraft_upload_${RUN_ID}/MoodCraftMeteo.jar MoodCraftMeteo.jar
          mv _moodcraft_upload_${RUN_ID}/MoodcraftChestLock.jar MoodcraftChestLock.jar
          mv _moodcraft_upload_${RUN_ID}/Moodtownmenu.jar Moodtownmenu.jar
          mv _moodcraft_upload_${RUN_ID}/MoodBusiness.jar MoodBusiness.jar
          mv _moodcraft_upload_${RUN_ID}/MoodEvent.jar MoodEvent.jar
          mv _moodcraft_upload_${RUN_ID}/MoodJobsGUI.jar MoodJobsGUI.jar
          rmdir "_moodcraft_upload_${RUN_ID}"
          cls -l *.jar
          bye
          EOF

          lftp -u "${SFTP_USER}","${SFTP_PASSWORD}" -p "${SFTP_PORT}" "sftp://${SFTP_HOST}" < upload.lftp
