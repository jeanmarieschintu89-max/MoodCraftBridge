name: 1 Construire tous les plugins MoodCraft

run-name: 1 Construire tous les plugins MoodCraft - vérification complète

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: moodcraft-build-all
  cancel-in-progress: false

jobs:
  build-all:
    name: Construire tous les jars des plugins
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer tous les plugins
        shell: bash
        env:
          TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          mkdir -p sources

          repos=(
            MoodAuth
            MoodVilleDrapeau
            MoodCraftBridge
            MoodTownGrade
            MoodCraftMeteo
            MoodcraftChestLock
            Moodtownmenu
            MoodBusiness
            MoodEvent
            MoodJobsGUI
          )

          for repo in "${repos[@]}"; do
            echo "========================================"
            echo "Checkout ${repo}"
            echo "========================================"
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/jeanmarieschintu89-max/${repo}.git" "sources/${repo}"
          done

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'sources/**/pom.xml'

      - name: Construire les plugins et collecter les jars
        shell: bash
        run: |
          set -u
          mkdir -p dist logs

          plugins=(
            MoodAuth
            MoodVilleDrapeau
            MoodCraftBridge
            MoodTownGrade
            MoodCraftMeteo
            MoodcraftChestLock
            Moodtownmenu
            MoodBusiness
            MoodEvent
            MoodJobsGUI
          )

          failed=0
          failed_plugins=()

          for plugin in "${plugins[@]}"; do
            echo "========================================"
            echo "Building ${plugin}"
            echo "========================================"

            if [ ! -f "sources/${plugin}/pom.xml" ]; then
              echo "MISSING_POM ${plugin}" | tee "logs/${plugin}.log"
              failed=1
              failed_plugins+=("${plugin}")
              continue
            fi

            if (cd "sources/${plugin}" && mvn -B -DskipTests clean package > "../../logs/${plugin}.log" 2>&1); then
              jar="$(find "sources/${plugin}/target" -maxdepth 1 -type f -name '*.jar' ! -name '*original*' ! -name '*sources*' ! -name '*javadoc*' | sort | head -n 1)"

              if [ -z "${jar}" ]; then
                echo "NO_JAR ${plugin}" | tee -a "logs/${plugin}.log"
                failed=1
                failed_plugins+=("${plugin}")
                continue
              fi

              cp "${jar}" "dist/${plugin}.jar"
              echo "OK ${plugin} -> dist/${plugin}.jar"
            else
              echo "FAILED ${plugin}"
              failed=1
              failed_plugins+=("${plugin}")
              echo "----- ${plugin} build log tail -----"
              tail -n 120 "logs/${plugin}.log" || true
              echo "----- end ${plugin} build log tail -----"
            fi
          done

          echo "========================================"
          echo "Collected jars"
          echo "========================================"
          ls -lah dist || true

          if [ "${failed}" -ne 0 ]; then
            echo "========================================"
            echo "Failed plugins"
            echo "========================================"
            printf '%s\n' "${failed_plugins[@]}"
            echo "One or more plugin builds failed. Check the MoodCraft-build-logs artifact."
            exit 1
          fi

      - name: Publier tous les jars des plugins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoodCraft-all-plugin-jars
          path: dist/*.jar
          if-no-files-found: warn

      - name: Publier les logs de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoodCraft-build-logs
          path: logs/*.log
          if-no-files-found: warn
