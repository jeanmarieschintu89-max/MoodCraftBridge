name: Build all MoodCraft plugins

run-name: Build all MoodCraft plugins

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: moodcraft-build-all
  cancel-in-progress: false

jobs:
  build-all:
    name: Build all plugin jars
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MoodAuth
        uses: actions/checkout@v4
        with:
          repository: jeanmarieschintu89-max/MoodAuth
          path: sources/MoodAuth
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout MoodVilleDrapeau
        uses: actions/checkout@v4
        with:
          repository: jeanmarieschintu89-max/MoodVilleDrapeau
          path: sources/MoodVilleDrapeau
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout MoodCraftBridge
        uses: actions/checkout@v4
        with:
          repository: jeanmarieschintu89-max/MoodCraftBridge
          path: sources/MoodCraftBridge
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout MoodTownGrade
        uses: actions/checkout@v4
        with:
          repository: jeanmarieschintu89-max/MoodTownGrade
          path: sources/MoodTownGrade
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout MoodCraftMeteo
        uses: actions/checkout@v4
        with:
          repository: jeanmarieschintu89-max/MoodCraftMeteo
          path: sources/MoodCraftMeteo
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout MoodcraftChestLock
        uses: actions/checkout@v4
        with:
          repository: jeanmarieschintu89-max/MoodcraftChestLock
          path: sources/MoodcraftChestLock
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout Moodtownmenu
        uses: actions/checkout@v4
        with:
          repository: jeanmarieschintu89-max/Moodtownmenu
          path: sources/Moodtownmenu
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout MoodBusiness
        uses: actions/checkout@v4
        with:
          repository: jeanmarieschintu89-max/MoodBusiness
          path: sources/MoodBusiness
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout MoodEvent
        uses: actions/checkout@v4
        with:
          repository: jeanmarieschintu89-max/MoodEvent
          path: sources/MoodEvent
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout MoodJobsGUI
        uses: actions/checkout@v4
        with:
          repository: jeanmarieschintu89-max/MoodJobsGUI
          path: sources/MoodJobsGUI
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build plugins and collect fixed jars
        shell: bash
        run: |
          set -u

          mkdir -p dist logs

          plugins=(
            MoodAuth
            MoodVilleDrapeau
            MoodCraftBridge
            MoodTownGrade
            MoodCraftMeteo
            MoodcraftChestLock
            Moodtownmenu
            MoodBusiness
            MoodEvent
            MoodJobsGUI
          )

          failed=0
          failed_plugins=()

          for plugin in "${plugins[@]}"; do
            echo "========================================"
            echo "Building ${plugin}"
            echo "========================================"

            if [ ! -f "sources/${plugin}/pom.xml" ]; then
              echo "MISSING_POM ${plugin}" | tee "logs/${plugin}.log"
              failed=1
              failed_plugins+=("${plugin}")
              continue
            fi

            if (cd "sources/${plugin}" && mvn -B -DskipTests clean package > "../../logs/${plugin}.log" 2>&1); then
              jar="$(find "sources/${plugin}/target" -maxdepth 1 -type f -name '*.jar' ! -name '*original*' ! -name '*sources*' ! -name '*javadoc*' | sort | head -n 1)"

              if [ -z "${jar}" ]; then
                echo "NO_JAR ${plugin}" | tee -a "logs/${plugin}.log"
                failed=1
                failed_plugins+=("${plugin}")
                continue
              fi

              cp "${jar}" "dist/${plugin}.jar"
              echo "OK ${plugin} -> dist/${plugin}.jar"
            else
              echo "FAILED ${plugin}"
              failed=1
              failed_plugins+=("${plugin}")
              echo "----- ${plugin} build log tail -----"
              tail -n 120 "logs/${plugin}.log" || true
              echo "----- end ${plugin} build log tail -----"
            fi
          done

          echo "========================================"
          echo "Collected jars"
          echo "========================================"
          ls -lah dist || true

          if [ "${failed}" -ne 0 ]; then
            echo "========================================"
            echo "Failed plugins"
            echo "========================================"
            printf '%s\n' "${failed_plugins[@]}"
            echo "One or more plugin builds failed. Check the MoodCraft-build-logs artifact."
            exit 1
          fi

      - name: Upload all plugin jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoodCraft-all-plugin-jars
          path: dist/*.jar
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoodCraft-build-logs
          path: logs/*.log
          if-no-files-found: warn
